name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          node -v && npm -v
          npm ci 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm ci failed (node $(node -v), npm $(npm -v))::$(grep -vE '^npm (warn|notice)' npm-ci.log | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            exit "$status"
          fi
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm test
