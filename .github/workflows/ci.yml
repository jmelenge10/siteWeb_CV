name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          node -v && npm -v
          npm ci 2>&1 | tee npm-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm ci failed (node $(node -v), npm $(npm -v))::$(grep -vE '^npm (warn|notice)' npm-ci.log | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            exit "$status"
          fi
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      # The patterns (phone, address…) are private: they live in the PRIVACY_PATTERNS repository secret.
      # The scan prints file names only, never the pattern or the matched text.
      - name: Privacy scan
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
          # Without the secret the scan is skipped with a warning (Dependabot and forks cannot read secrets).
          # Set the repository variable PRIVACY_SCAN_REQUIRED to 1 to make a missing secret fail on main.
          PRIVACY_SCAN_REQUIRED: ${{ github.event_name == 'push' && vars.PRIVACY_SCAN_REQUIRED || '' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
          node scripts/privacy-scan.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm test
